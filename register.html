<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library System - Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" id="theme-style" href="css/darkmode.css" disabled>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #varta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      position: relative;
      z-index: 2; 
      width: 100%;
      max-width: 370px;
      padding: 40px;
      border-radius: 14px; 
      text-align: center;
      background: rgba(255, 255, 255, 0.08); 
      backdrop-filter: blur(12px);          
      -webkit-backdrop-filter: blur(12px);   
      border: 1px solid rgba(255, 255, 255, 0.15); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }
    
    .dark-theme .login-box {
      background: rgba(15, 17, 26, 0.45); 
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .login-title { margin-bottom: 0.7em; color: var(--primary); }
    #regMsg { min-height: 2em; margin-top: 10px; font-weight: 500; }

    .login-links-container {
      display: flex;
      justify-content: center;
      margin-top: 1.2rem;
      font-size: 0.88rem;
    }

    .login-link {
      color: var(--primary, #4e73df);
      text-decoration: none;
      font-weight: 500;
    }

    .login-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="varta-bg">
    <div class="login-box">
      <h2 class="login-title"><i class="fa-solid fa-user-plus"></i> Create Account</h2>
      
      <form id="registerForm" autocomplete="off">
        <input type="text" id="regFullname" placeholder="Full Name" required autofocus>
        <input type="email" id="regEmail" placeholder="Email Address" required>
        <input type="text" id="regUsername" placeholder="Username" autocomplete="username" required>
        <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password" required>
        
        <select id="regRole" required>
          <option value="" selected disabled>-- Apply as Role --</option>
          <option value="user">User (Student/Staff)</option>
          <option value="admin">Admin</option>
        </select>
        <br>
        <button type="submit" style="width:100%;">Register</button>
      </form>

      <div class="login-links-container">
        <span style="color: rgba(255,255,255,0.7); margin-right: 5px;">Already have an account?</span>
        <a href="login.html" class="login-link">Login here</a>
      </div>

      <div id="regMsg"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
  
  <script>
    // Determine the active theme status dynamically before painting interface objects
    const isDarkModeActive = localStorage.getItem('theme') === 'dark' || localStorage.getItem('darkMode') === 'yes';
    
    if (isDarkModeActive) {
      if(document.getElementById('theme-style')) document.getElementById('theme-style').disabled = false;
      document.body.classList.add('dark-theme');
    }

    // Dynamic background layout color updates based on dark/light engine rules
    VANTA.CLOUDS({
        el: "#varta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        skyColor: isDarkModeActive ? 0x0f111a : 0x1697ff,     // Midnight slate vs Crisp Summer Sky Blue
        cloudColor: isDarkModeActive ? 0x23273a : 0xadc8e1,   // Stormy translucent dark vs clean bright cloud
    });

    // Form Submission Controller Logic 
    document.getElementById('registerForm').onsubmit = function(e) {
      e.preventDefault();
      const msg = document.getElementById('regMsg');
      
      const name = document.getElementById('regFullname').value.trim();
      const email = document.getElementById('regEmail').value.trim(); 
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value; 

      // 1. Fetch system records array data
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      
      // 2. Prevent duplicate usernames (case-insensitive check execution)
      if(users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        msg.style.color = '#dc3545';
        msg.textContent = "Username already exists!";
        return;
      }

      // 3. Save matching structural parameters alongside missing custom options
      const newUser = { 
        name: name,
        email: email,       
        username: username, 
        password: password, 
        pass: password,     
        role: role 
      };

      users.push(newUser);
      localStorage.setItem('users', JSON.stringify(users));

      // 4. Show a crisp success indicator matching interface styling guidelines
      msg.style.color = '#26a69a';
      msg.textContent = "Registration successful! Redirecting...";
      
      // Clear interface and safely redirect back to the central login point
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1800);
    };
  </script>
</body>
</html>
