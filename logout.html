<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout - Library System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" id="theme-style" href="css/darkmode.css"disabled>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .logout-container {
      max-width:400px;
      margin:150px auto;
      text-align:center;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      padding:45px 30px 35px 30px;
    }
    .logout-container a {
      display:inline-block; 
      margin-top:24px; 
      background:var(--primary);
      color:#fff;
      padding:10px 32px; 
      border-radius:7px; 
      text-decoration:none;
      font-size:1.1em;
    }
    .logout-container a:hover { background:#1c4487; }
  </style>
</head>
<body>
  <div class="logout-container">
    <h2 style="color:var(--primary);font-size:2em;">You have been logged out.</h2>
    <div style="margin-top:12px; color: #555;">
      Thank you for using the Library System.<br>
      <a href="login.html">🔐 Login Again</a>
    </div>
  </div>
  <script>
    localStorage.removeItem('user');
    if(localStorage.getItem('darkMode')==='yes')
      document.getElementById('theme-style').disabled = false;
  </script>
</body>
</html>
